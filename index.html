let lineState={};
function drawLine(){
  const series=ORDER.map(t=>({t,color:LCOLOR[t],pts:DATA.cum[t]}));
  if(!Object.keys(lineState).length) series.forEach(s=>lineState[s.t]=['SMH','SOXX','VGT','QQQ','SPY','BRK.B'].includes(s.t));
  const lc=document.getElementById('logchk'); const logScale= lc? lc.checked : true;
  const W=1120,H=420,ml=54,mr=16,mt=16,mb=34, iw=W-ml-mr, ih=H-mt-mb;
  const n=series[0].pts.length-1;
  const allv=series.map(s=>s.pts).flat();
  const ymin=Math.floor(Math.min(...allv)/50)*50, ymax=Math.ceil(Math.max(...allv)/50)*50;
  const X=i=> ml+iw*i/n;
  const Y= logScale
    ? v=> mt+ih*(1-(Math.log(v)-Math.log(ymin))/(Math.log(ymax)-Math.log(ymin)))
    : v=> mt+ih*(1-(v-ymin)/(ymax-ymin));
  let ticks=[];
  if(logScale){ [100,150,200,300,500,700,1000,1500,2000,3000].forEach(v=>{if(v>=ymin&&v<=ymax)ticks.push(v);}); }
  else { const step=(ymax-ymin)/6; for(let v=ymin;v<=ymax+1e-6;v+=step) ticks.push(Math.round(v)); }
  let g='';
  ticks.forEach(v=>{const yy=Y(v);
    g+=`<line x1="${ml}" y1="${yy}" x2="${W-mr}" y2="${yy}" stroke="#eef2f7"/><text x="${ml-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#94a3b8">${v}</text>`;});
  const xl=['2015','2016','2017','2018','2019','2020','2021','2022','2023','2024','2025','2026'];
  xl.forEach((lb,i)=>{g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle" font-size="11" fill="#94a3b8">${lb}</text>`;});
  let paths='';
  series.forEach(s=>{ if(!lineState[s.t])return;
    paths+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" points="${s.pts.map((v,i)=>X(i)+','+Y(v).toFixed(1)).join(' ')}"/>`;
    paths+=`<circle cx="${X(n).toFixed(1)}" cy="${Y(s.pts[n]).toFixed(1)}" r="3" fill="${s.color}"/>`;});
  document.getElementById('linechart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}${paths}</svg>`;
  document.getElementById('linelegend').innerHTML=series.map(s=>
    `<span class="it ${lineState[s.t]?'':'off'}" data-t="${s.t}"><span class="sw" style="background:${s.color}"></span>${s.t}</span>`).join('');
  document.querySelectorAll('#linelegend .it').forEach(el=>el.onclick=()=>{lineState[el.dataset.t]=!lineState[el.dataset.t];drawLine();});
  if(lc) lc.onchange=drawLine;
}

  // 集中度对比
  const cmax=Math.max(...withH.map(t=>BY[t].conc10));
  const cbars=withH.map(t=>{const e=BY[t];
    return `<div class="bar"><div class="tk" style="color:${e.color}">${t}</div>
      <div class="tr" style="position:relative"><div class="fi" style="width:${(e.conc10/cmax*100).toFixed(1)}%;background:${e.color}"></div></div>

      <div class="note-sm">SMH 前10占约70%（英伟达一个就16%）；等权的 XSD 仅28%，几乎不押注单个巨头。</div></div>

      <div class="note-sm">FTEC 18.3%、VGT 16.8%、SMH 16% 最高；标普500 约7.5%；QQQ 约7.6%；等权 XSD 仅约2%。</div></div>

function drawHolding(){
  const t=document.getElementById('hsel').value, e=BY[t], h=DATA.hold[t];
  const max=Math.max(...h.map(x=>x[2]));
  document.getElementById('hmeta').innerHTML=`管理人 ${e.issuer} · 费率 ${e.er}% · 规模 ${aum(e.aum)} · 共 ${e.nhold>=1000?e.nhold.toLocaleString():'~'+e.nhold} 只持仓`;
  document.getElementById('htop').innerHTML=`<h3>${t} 前十大持仓</h3><div class="bars">`+
    h.map((x,i)=>`<div class="bar"><div class="tk mono" title="${esc(x[1])}">${x[0]}</div>
      <div class="tr"><div class="fi" style="width:${(x[2]/max*100).toFixed(1)}%;background:${i===0?'#76b900':e.color}"></div></div>
      <div class="vl">${x[2].toFixed(2)}%</div></div>`).join('')+`</div>`;
  const rest=100-e.conc10;
  document.getElementById('hstat').innerHTML=`<h3>集中度指标</h3>
    <div class="gauge"><div class="gl"><span>前3大合计</span><b class="mono">${e.conc3}%</b></div>
      <div class="track" style="background:#eef2f7"><div style="position:absolute;left:0;top:0;bottom:0;width:${e.conc3}%;background:${e.color};border-radius:8px;opacity:.85"></div></div></div>
    <div class="gauge"><div class="gl"><span>前10大合计</span><b class="mono">${e.conc10}%</b></div>
      <div class="track" style="background:#eef2f7"><div style="position:absolute;left:0;top:0;bottom:0;width:${e.conc10}%;background:${e.color};border-radius:8px;opacity:.85"></div></div></div>
    <div class="gauge"><div class="gl"><span>其余 ${e.nhold>1?(e.nhold-10):0} 只合计</span><b class="mono">${rest.toFixed(1)}%</b></div>
      <div class="track" style="background:#eef2f7"><div style="position:absolute;left:0;top:0;bottom:0;width:${rest}%;background:#94a3b8;border-radius:8px;opacity:.5"></div></div></div>
    <div class="note">${e.conc10>=60?'<b>高度集中：</b>前十占六成以上，单一个股权重大，涨跌主要由少数龙头决定。':e.conc10<=35?'<b>相对分散：</b>龙头权重被压制或采用等权，个股风险分散但牛市弹性偏弱。':'<b>中等集中：</b>兼顾龙头与分散。'}</div>`;
}
